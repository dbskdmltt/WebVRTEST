<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest 1 WebVR Classroom</title>
  <!-- Older A-Frame version chosen for legacy Quest browser compatibility. -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script>
    // Change these colors to customize the objects.
    AFRAME.registerComponent('color-toggle', {
      schema: { first: {default: '#F97373'}, second: {default: '#4ADE80'} },
      init: function () {
        var el = this.el;
        var data = this.data;
        var active = false;
        el.addEventListener('click', function () {
          active = !active;
          el.setAttribute('material', 'color', active ? data.second : data.first);
        });
        el.addEventListener('mouseenter', function () { el.setAttribute('scale', '1.08 1.08 1.08'); });
        el.addEventListener('mouseleave', function () { el.setAttribute('scale', '1 1 1'); });
      }
    });
  </script>
</head>
<body>
  <a-scene background="color: #B9E5FF" renderer="antialias: true" vr-mode-ui="enabled: true">
    <!-- Camera: 1.6 m eye height. Mouse clicks work on desktop. -->
    <a-entity position="0 1.6 0">
      <a-camera look-controls wasd-controls>
        <a-cursor raycaster="objects: .clickable" fuse="false" color="#FFFFFF"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Quest controllers: aim at an object and press trigger. -->
    <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 12" line="color: #FFD166; opacity: 0.8"></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 12" line="color: #FFD166; opacity: 0.8"></a-entity>

    <!-- Clickable objects. Modify position, geometry and colors here. -->
    <a-box class="clickable" position="-1.5 1.2 -3" width="0.9" height="0.9" depth="0.9"
           material="color: #F97373" color-toggle="first: #F97373; second: #4ADE80"></a-box>
    <a-sphere class="clickable" position="0 1.25 -3" radius="0.55"
              material="color: #F97373" color-toggle="first: #F97373; second: #FACC15"></a-sphere>
    <a-cylinder class="clickable" position="1.5 1.1 -3" radius="0.45" height="1.1"
                material="color: #F97373" color-toggle="first: #F97373; second: #A78BFA"></a-cylinder>

    <!-- Ground and simple lighting. -->
    <a-plane position="0 0 -3" rotation="-90 0 0" width="40" height="40" color="#91BE8C"></a-plane>
    <a-light type="ambient" color="#FFFFFF" intensity="0.75"></a-light>
    <a-light type="directional" color="#FFFFFF" intensity="0.55" position="-1 4 2"></a-light>
    <a-text value="QUEST 1 WEBVR" position="-1.65 2.65 -3" color="#17324D" width="4" align="center"></a-text>
    <a-text value="Point and press trigger to change colors" position="-1.85 2.32 -3" color="#17324D" width="3.7" align="center"></a-text>
  </a-scene>
</body>
</html>
