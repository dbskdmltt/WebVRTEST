<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebVR Art</title><script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script><script>
// 학생 수정 영역: 관객 행동(trigger), 작품 반응(response), 형태(shape), 색상(color), 문장(message)
var CONFIG={"title":"사라지는 조각","trigger":"near","response":"scale","shape":"torus","color":"#281a5b","message":"관객의 행동이 작품을 완성합니다."};
AFRAME.registerComponent('art-interaction',{init:function(){var el=this.el,self=this;this.clickCount=0;this.effectCount=0;this.inside=false;this.gazeTimer=null;this.baseColor=CONFIG.color;this.soundContext=null;this.triggerEffect=function(){self.effectCount++;var n=self.effectCount,kind=CONFIG.response;if(kind==='color'){el.setAttribute('material','color',n%2?'#4be5c4':CONFIG.color)}else if(kind==='scale'){var s=Math.min(2.4,1+n*.2);el.setAttribute('scale',s+' '+s+' '+s)}else if(kind==='rotate'){el.setAttribute('animation__art','property: rotation; to: 0 '+(n*45)+' 0; dur: 650; easing: easeInOutQuad')}else if(kind==='fade'){var opacity=Math.max(.12,1-n*.17);el.setAttribute('material','transparent',true);el.setAttribute('material','opacity',opacity)}else if(kind==='duplicate'){if(n>7)return;var clone=document.createElement('a-entity');clone.setAttribute('geometry','primitive: '+CONFIG.shape+'; '+(CONFIG.shape==='torus'?'radius: 0.35; radiusTubular: 0.09':'width: 0.55; height: 0.55; depth: 0.55; radius: 0.35'));clone.setAttribute('material','color: '+CONFIG.color);clone.setAttribute('position',(-2+n*.58)+' 1.1 -3');document.querySelector('a-scene').appendChild(clone)}else if(kind==='text'){var txt=document.querySelector('#artMessage');txt.setAttribute('visible',n%2===1)}else if(kind==='sound'){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var ctx=self.soundContext||(self.soundContext=new AC());if(ctx.state==='suspended')ctx.resume();var osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=440+(n%6)*75;gain.gain.setValueAtTime(.08,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.3)}catch(e){}}};el.addEventListener('click',function(){if(CONFIG.trigger==='click')self.triggerEffect();else if(CONFIG.trigger==='repeat'){self.clickCount++;if(self.clickCount%3===0)self.triggerEffect()}});el.addEventListener('mouseenter',function(){if(CONFIG.trigger==='gaze'){self.gazeTimer=setTimeout(function(){self.triggerEffect();self.gazeTimer=null},3000)}});el.addEventListener('mouseleave',function(){if(self.gazeTimer){clearTimeout(self.gazeTimer);self.gazeTimer=null}})},tick:function(){if(CONFIG.trigger!=='near')return;var cam=document.querySelector('#camera');if(!cam||!cam.object3D)return;var p=new THREE.Vector3(),q=new THREE.Vector3();cam.object3D.getWorldPosition(p);this.el.object3D.getWorldPosition(q);var d=p.distanceTo(q);if(d<2.2&&!this.inside){this.inside=true;this.triggerEffect()}if(d>2.7)this.inside=false},remove:function(){if(this.gazeTimer)clearTimeout(this.gazeTimer)}});
</script></head><body>
<a-scene background="color: #161d32" renderer="antialias: true" vr-mode-ui="enabled: true">
<a-entity id="camera" camera look-controls position="0 1.6 0"><a-cursor raycaster="objects: .interactive" fuse="false" material="color: #ffffff; shader: flat" geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012" position="0 0 -1"></a-cursor></a-entity>
<!-- Oculus Quest 1: 레이저 컨트롤러 트리거. 구형 브라우저에서 별도 테스트 필요 -->
<a-entity laser-controls="hand: left" raycaster="objects: .interactive; far: 12" line="color: #a6b8ff"></a-entity>
<a-entity laser-controls="hand: right" raycaster="objects: .interactive; far: 12" line="color: #a6b8ff"></a-entity>
<a-plane rotation="-90 0 0" width="18" height="18" color="#29354d"></a-plane><a-sky color="#161d32"></a-sky><a-light type="ambient" intensity="0.7" color="#ffffff"></a-light><a-light type="directional" position="-2 5 3" intensity="0.9"></a-light>
<a-entity id="art" class="interactive" art-interaction position="0 1.7 -3"></a-entity>
<a-text id="artTitle" position="0 3.1 -3" align="center" width="5" color="#ffffff"></a-text>
<a-text id="artMessage" position="0 0.65 -3" align="center" width="4.5" color="#ffffff" visible="false"></a-text>
<a-text value="Trigger: controller | Gaze: 3 sec | Approach: move closer" position="0 0.3 -3" align="center" width="4" color="#aebbd6"></a-text>
</a-scene><script>
(function(){var el=document.querySelector('#art');el.setAttribute('geometry','primitive: '+CONFIG.shape+(CONFIG.shape==='torus'?'; radius: 0.72; radiusTubular: 0.17':CONFIG.shape==='sphere'?'; radius: 0.75':CONFIG.shape==='cylinder'?'; radius: 0.65; height: 1.4':'; width: 1.4; height: 1.4; depth: 1.4'));el.setAttribute('material','color: '+CONFIG.color+'; roughness: 0.55');document.querySelector('#artTitle').setAttribute('value',CONFIG.title);document.querySelector('#artMessage').setAttribute('value',CONFIG.message)})();
</script></body></html>
